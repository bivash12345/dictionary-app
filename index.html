<!DOCTYPE html>
<html>
<head>
  <title>Dictionary App</title>
</head>
<body>

<h2>📘 English → Bangla Dictionary</h2>

<input id="eng" placeholder="English word">
<input id="ban" placeholder="Bangla meaning">
<button onclick="saveWord()">Save</button>

<br><br>
<ul id="list"></ul>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

// ⚠️ তোমার Firebase config বসাও
const firebaseConfig = {
  apiKey: "AIzaSyDIejKxhqJRp2l3d9WGvANRZY8qGK16pXE",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com/",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ✅ SAVE
window.saveWord = function () {
  let eng = document.getElementById("eng").value;
  let ban = document.getElementById("ban").value;

  if (eng === "" || ban === "") {
    alert("Fill all fields");
    return;
  }

  push(ref(db, "words"), {
    english: eng,
    bangla: ban
  });

  document.getElementById("eng").value = "";
  document.getElementById("ban").value = "";
};

// ❌ DELETE
window.deleteWord = function (key) {
  if (confirm("Delete this word?")) {
    remove(ref(db, "words/" + key));
  }
};

// 📋 SHOW
onValue(ref(db, "words"), (snapshot) => {
  let list = document.getElementById("list");
  list.innerHTML = "";

  snapshot.forEach((child) => {
    let data = child.val();
    let key = child.key;

    let li = document.createElement("li");
    li.innerHTML = data.english + " = " + data.bangla +
      ` <button onclick="deleteWord('${key}')">❌</button>`;

    list.appendChild(li);
  });
});

</script>

</body>
</html>
