<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English ➜ Bangla Dictionary</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f1f3f6;
      padding:20px;
    }

    .header{
      background:linear-gradient(to right,#1f4ed8,#2546b8);
      color:white;
      padding:30px;
      border-radius:12px 12px 0 0;
    }

    .header h1{
      font-size:45px;
    }

    .header p{
      margin-top:10px;
      font-size:22px;
    }

    .container{
      background:white;
      padding:20px;
      border-radius:0 0 12px 12px;
      display:flex;
      gap:20px;
      flex-wrap:wrap;
    }

    .left,
    .right{
      flex:1;
      min-width:320px;
      border:1px solid #ddd;
      border-radius:10px;
      padding:20px;
    }

    h2{
      margin-bottom:20px;
    }

    .blue{
      color:#1d4ed8;
    }

    .green{
      color:#16a34a;
    }

    input{
      width:100%;
      padding:14px;
      margin-top:10px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:18px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:8px;
      color:white;
      font-size:20px;
      cursor:pointer;
    }

    .search-btn{
      background:#2563eb;
    }

    .add-btn{
      background:#16a34a;
    }

    #result{
      margin-top:20px;
      background:#eefbf0;
      border:1px solid #b6e3c1;
      padding:20px;
      border-radius:10px;
      font-size:24px;
      color:#111;
    }

    .word-list{
      margin-top:25px;
      max-height:350px;
      overflow-y:auto;
      border:1px solid #ddd;
      border-radius:10px;
    }

    .word-item{
      display:flex;
      justify-content:space-between;
      padding:15px;
      border-bottom:1px solid #eee;
      font-size:22px;
    }

    .note{
      margin-top:30px;
      background:#eef4ff;
      border:1px solid #bfd3ff;
      padding:20px;
      border-radius:10px;
      color:#1d4ed8;
      font-size:18px;
    }

    .delete-btn{
      background:red;
      color:white;
      border:none;
      padding:5px 10px;
      border-radius:5px;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📖 English ➜ Bangla Dictionary</h1>
    <p>Search and add new words to the dictionary</p>
  </div>

  <div class="container">

    <!-- LEFT SIDE -->
    <div class="left">

      <h2 class="blue">🔍 Search Word</h2>

      <input type="text" id="searchWord" placeholder="Enter English word">

      <button class="search-btn" onclick="searchMeaning()">
        Search
      </button>

      <div id="result">
        বাংলা অর্থ: ---
      </div>

      <h2 style="margin-top:25px;">All Words</h2>

      <div class="word-list" id="wordList"></div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

      <h2 class="green">➕ Add New Word</h2>

      <label>English Word</label>
      <input type="text" id="englishInput" placeholder="Enter English word">

      <label>Bangla Meaning</label>
      <input type="text" id="banglaInput" placeholder="Enter Bangla meaning">

      <button class="add-btn" onclick="addWord()">
        Add Word
      </button>

      <div class="note">
        ℹ️ Note: Make sure the word doesn't already exist.
      </div>

    </div>

  </div>

  <script>

    let dictionary = {
      hello: "হ্যালো",
      book: "বই",
      apple: "আপেল",
      water: "পানি",
      school: "স্কুল",
      teacher: "শিক্ষক",
      student: "ছাত্র",
      computer: "কম্পিউটার"
    };

    // Search Function
    function searchMeaning(){

      let word = document.getElementById("searchWord").value.toLowerCase();

      let result = document.getElementById("result");

      if(dictionary[word]){
        result.innerHTML = "বাংলা অর্থ: " + dictionary[word];
      }
      else{
        result.innerHTML = "Word not found!";
      }
    }

    // Add Word
    function addWord(){

      let english = document.getElementById("englishInput").value.toLowerCase();

      let bangla = document.getElementById("banglaInput").value;

      if(english === "" || bangla === ""){
        alert("Fill all fields");
        return;
      }

      if(dictionary[english]){
        alert("Word already exists!");
        return;
      }

      dictionary[english] = bangla;

      showWords();

      document.getElementById("englishInput").value = "";
      document.getElementById("banglaInput").value = "";

      alert("Word Added Successfully!");
    }

    // Show All Words
    function showWords(){

      let wordList = document.getElementById("wordList");

      wordList.innerHTML = "";

      for(let word in dictionary){

        wordList.innerHTML += `
          <div class="word-item">
            <span>${word} ➜ ${dictionary[word]}</span>
            <button class="delete-btn"
            onclick="deleteWord('${word}')">X</button>
          </div>
        `;
      }
    }

    // Delete Word
    function deleteWord(word){

      delete dictionary[word];

      showWords();
    }

    // First Load
    showWords();

  </script>

</body>
</html>
